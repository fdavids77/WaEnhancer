name: Android CI

on:
  push:
    branches: [ "master", "main", "feature/*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, 'skip ci')

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write key
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo "${{ secrets.KEY_STORE }}" | base64 --decode > key.jks
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleWhatsappDebug assembleBusinessDebug -Pminify=true

      - name: Upload WhatsApp APK
        uses: actions/upload-artifact@v4
        with:
          name: WaEnhancer-WhatsApp
          path: app/build/outputs/apk/whatsapp/debug/app-whatsapp-debug.apk

      - name: Upload Business APK
        uses: actions/upload-artifact@v4
        with:
          name: WaEnhancer-Business
          path: app/build/outputs/apk/business/debug/app-business-debug.apk

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "WaEnhancer ${{ github.sha }}"
          tag_name: "debug-${{ github.sha }}"
          files: |
            app/build/outputs/apk/whatsapp/debug/app-whatsapp-debug.apk
            app/build/outputs/apk/business/debug/app-business-debug.apk
